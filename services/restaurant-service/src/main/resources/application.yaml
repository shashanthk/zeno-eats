spring:
  application:
    name: restaurant-service
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/zeno_eats_db}
    username: ${DB_USERNAME:zeno_app_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        ddl-auto: update

server:
  port: 8082
