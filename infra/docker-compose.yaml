services:
  zeno-mysql-db:
    image: mariadb:12.0.2-noble
    container_name: zeno-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - zeno-db-data:/var/lib/mysql
    networks:
      - zeno-eats-network

  zeno-redis-cache:
    image: redis:alpine3.22
    container_name: zeno-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - zeno-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 2s
      retries: 5
    networks:
      - zeno-eats-network

  zeno-postgres-db:
    image: postgres:16-alpine
    container_name: zeno-postgres-db
    restart: always
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - zeno-user-db-data:/var/lib/postgresql/data
    networks:
      - zeno-eats-network

volumes:
  zeno-db-data:
  zeno-redis-data:
  zeno-user-db-data:

networks:
  zeno-eats-network:
