services:
  zeno-restaurant-db:
    image: postgres:16-alpine
    container_name: zeno-restaurant-db
    restart: always
    environment:
      POSTGRES_DB: ${RESTAURANT_DB_NAME}
      POSTGRES_USER: ${RESTAURANT_DB_USERNAME}
      POSTGRES_PASSWORD: ${RESTAURANT_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - zeno-restaurant-db-data:/var/lib/postgresql/data
      - ./init/restaurant-service:/docker-entrypoint-initdb.d:ro
    networks:
      - zeno-eats-network

  zeno-user-db:
    image: postgres:16-alpine
    container_name: zeno-user-db
    restart: always
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - zeno-user-db-data:/var/lib/postgresql/data
      - ./init/user-service:/docker-entrypoint-initdb.d:ro
    networks:
      - zeno-eats-network

  zeno-redis-cache:
    image: redis:alpine3.22
    container_name: zeno-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - zeno-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 2s
      retries: 5
    networks:
      - zeno-eats-network

volumes:
  zeno-restaurant-db-data:
  zeno-user-db-data:
  zeno-redis-data:

networks:
  zeno-eats-network:
